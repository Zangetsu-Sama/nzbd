# Category taxonomy (single source of truth; PARSER_SPEC section Taxonomy).
# Embedded into nzb-core at build time, seeded into the `category` table by nzb-store and listed
# by `nzbd categories`. Hint values (X-Category, upload dropdown, watch sub-folder) are compared
# against `id` / `slug` exactly. Parents must appear before their children. Id 8010 is the
# fallback and must exist. Changing an id here changes stored data: never renumber.

[[category]]
