[package]
name = "nzb-core"
description = "Pure NZB logic: parse, sanitize, analyze, categorize (no I/O)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
quick-xml = { version = "0.42.0", default-features = false }
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
thiserror = "2"
toml = { version = "1.1.7", default-features = false, features = ["parse", "serde"] }
unicode-normalization = "0.1"

[dev-dependencies]
cap = "0.1"
nzb-testkit = { path = "../nzb-testkit", version = "0.6.0" }
proptest = "1"
serde_json = "1"
