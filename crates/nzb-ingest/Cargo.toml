[package]
name = "nzb-ingest"
description = "Watch-folder scanner and ingest pipeline"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# `catch_unwind` on the commit-group future: a panic there must not end the writer (already in the
# lockfile; same version and features as nzb-web).
futures-util = { version = "0.3.32", default-features = false, features = ["std"] }
libc = "0.2"
notify = { version = "8", default-features = false }
nzb-core = { path = "../nzb-core", version = "0.6.0" }
nzb-store = { path = "../nzb-store", version = "0.6.0" }
# `nzbd import` (T115): a no-follow directory walk relative to directory descriptors (`openat`, `fstatat`, `Dir`)
# through a safe API; std has no `openat`. Already in the lockfile and used by nzbd (same version and features).
rustix = { version = "1.1.5", default-features = false, features = ["fs", "std"] }
# Watch-folder `filename` rules (T126), compiled once with size/nest limits; same version and features as
# nzb-core, already in the lockfile.
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode"] }
# JSON for the scene_* columns (already a dependency of nzb-store).
serde_json = "1"
# Digest of the copy when moving across filesystems (already in the lockfile).
sha2 = "0.10"
thiserror = "2"
# Worker tasks, bounded mpsc + oneshot reply, spawn_blocking for parsing and file I/O.
tokio = { version = "1", default-features = false, features = ["rt", "sync", "time"] }
tracing = "0.1.44"

[dev-dependencies]
# Test-only: seeds quarantine rows directly (same sqlx as nzb-store, already in the lockfile).
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite-bundled", "sqlite-unlock-notify"] }
nzb-testkit = { path = "../nzb-testkit", version = "0.6.0" }
# The backend matrix (NZBD_TEST_BACKEND) and the Postgres test harness (T122).
nzb-store = { path = "../nzb-store", version = "0.6.0", features = ["pg-test-support"] }
# T131: ingest-to-search tests through the real indexer (`SettlingIndex`); workspace crate, no new package.
nzb-search = { path = "../nzb-search", version = "0.6.0", features = ["test-support"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
